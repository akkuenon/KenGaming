<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>KenGaming C# Terminal</title>
  <style>
    :root { color-scheme: dark; font-family: Consolas, "SFMono-Regular", monospace; }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; background: #020617; color: #e2f5ff; }
    .terminal { min-height: 100vh; display: flex; flex-direction: column; padding: 18px; }
    .window { flex: 1; display: flex; flex-direction: column; overflow: hidden; border: 1px solid #1f405b; border-radius: 14px; background: #07111f; box-shadow: 0 0 32px #0891b233; }
    .bar { display: flex; align-items: center; justify-content: space-between; gap: 16px; padding: 12px 16px; border-bottom: 1px solid #1f405b; background: #0d1b2f; color: #7dd3fc; font-size: 12px; letter-spacing: .12em; text-transform: uppercase; }
    .lights { display: flex; gap: 7px; }
    .lights i { width: 11px; height: 11px; border-radius: 50%; background: #22c55e; }
    .lights i:first-child { background: #ef4444; }
    .lights i:nth-child(2) { background: #eab308; }
    button { border: 1px solid #38bdf8; border-radius: 7px; padding: 7px 10px; color: #e0f2fe; background: #0c4a6e; font: inherit; cursor: pointer; }
    button:hover { background: #075985; }
    #output { flex: 1; overflow: auto; padding: 20px; white-space: pre-wrap; line-height: 1.55; }
    .line { margin: 0 0 6px; }
    .ok { color: #86efac; }
    .error { color: #fca5a5; }
    form { display: flex; gap: 10px; padding: 14px 16px 18px; border-top: 1px solid #1f405b; background: #0a1728; }
    label { color: #6ee7b7; white-space: nowrap; }
    input { min-width: 0; flex: 1; border: 0; outline: 0; color: #f8fafc; background: transparent; font: inherit; }
  </style>
</head>
<body>
  <main class="terminal">
    <section class="window" id="terminalWindow" aria-label="KenGaming C# terminal">
      <header class="bar"><span class="lights"><i></i><i></i><i></i></span><span>KenGaming // C# Shell</span><button id="fullscreenButton" type="button">FULLSCREEN</button></header>
      <div id="output" aria-live="polite"></div>
      <form id="commandForm"><label for="command">kg@dev:~$</label><input id="command" autocomplete="off" autofocus><button type="submit">RUN</button></form>
    </section>
  </main>
  <script>
    const output = document.getElementById('output');
    const input = document.getElementById('command');
    const form = document.getElementById('commandForm');
    const windowElement = document.getElementById('terminalWindow');
    const fullscreenButton = document.getElementById('fullscreenButton');
    const print = (text, className = '') => { const line = document.createElement('div'); line.className = `line ${className}`; line.textContent = text; output.appendChild(line); output.scrollTop = output.scrollHeight; };
    print('KenGaming C# terminal ready.', 'ok');
    print('Type help for available commands.');
    const commands = {
      help: () => 'help  clear  echo <text>  date  whoami  dotnet --version  exit',
      clear: () => { output.replaceChildren(); return ''; },
      date: () => new Date().toString(),
      whoami: () => 'ken',
      'dotnet --version': () => '8.0.100',
      exit: () => 'The browser terminal cannot close this tab.'
    };
    form.addEventListener('submit', event => { event.preventDefault(); const raw = input.value.trim(); if (!raw) return; print(`kg@dev:~$ ${raw}`); const [name, ...args] = raw.split(/\s+/); let result; if (name === 'echo') result = args.join(' '); else result = commands[raw] ? commands[raw]() : commands[name] ? commands[name]() : `command not found: ${name}`; if (result) print(result, result.startsWith('command not found') ? 'error' : ''); input.value = ''; input.focus(); });
    fullscreenButton.addEventListener('click', async () => { if (document.fullscreenElement) await document.exitFullscreen(); else await windowElement.requestFullscreen(); fullscreenButton.textContent = document.fullscreenElement ? 'EXIT FULLSCREEN' : 'FULLSCREEN'; });
    document.addEventListener('fullscreenchange', () => { fullscreenButton.textContent = document.fullscreenElement ? 'EXIT FULLSCREEN' : 'FULLSCREEN'; });
  </script>
</body>
</html>
