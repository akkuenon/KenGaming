<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>KenGaming Terminal — Under Maintenance</title>
    <style>
      :root { color-scheme: dark; font-family: "DM Sans", Arial, sans-serif; }
      * { box-sizing: border-box; }
      body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px; background: radial-gradient(circle at top, #172554, #020617 65%); color: #e2e8f0; }
      .maintenance { width: min(620px, 100%); padding: 42px 32px; text-align: center; border: 1px solid rgba(148, 163, 184, .22); border-radius: 22px; background: rgba(15, 23, 42, .86); box-shadow: 0 24px 70px rgba(0, 0, 0, .35); }
      .icon { display: grid; place-items: center; width: 72px; height: 72px; margin: 0 auto 22px; border-radius: 20px; background: linear-gradient(135deg, #22d3ee, #7c3aed); color: white; font: 700 25px Consolas, monospace; }
      h1 { margin: 0; font-size: clamp(1.8rem, 5vw, 2.7rem); letter-spacing: -.04em; }
      p { margin: 16px auto 26px; max-width: 480px; color: #a5b4fc; line-height: 1.65; }
      a { display: inline-block; border-radius: 10px; padding: 12px 18px; background: #22d3ee; color: #082f49; font-weight: 700; text-decoration: none; }
      a:hover { background: #67e8f9; }
      .status { display: inline-block; margin-top: 20px; color: #fbbf24; font: 700 12px Consolas, monospace; letter-spacing: .12em; text-transform: uppercase; }
    </style>
  </head>
  <body>
    <main class="maintenance" aria-labelledby="maintenance-title">
      <div class="icon" aria-hidden="true">C#</div>
      <h1 id="maintenance-title">Terminal under maintenance</h1>
      <p>The KenGaming terminal is temporarily unavailable while we work on improvements. Please return to the arcade and try again later.</p>
      <a href="../index.html?view=arcade#arcade">Back to Arcade</a>
      <div class="status">Temporarily offline</div>
    </main>
  </body>
</html>
